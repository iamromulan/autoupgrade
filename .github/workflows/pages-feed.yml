name: Deploy Feed

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p site

          LATEST_TAG=$(gh release view --json tagName -q '.tagName')
          echo "Latest release: $LATEST_TAG"

          gh release download "$LATEST_TAG" --dir site/

      - name: Organize feed structure
        run: |
          mkdir -p feed

          for version_dir in 23.05 24.10 25.12; do
            mkdir -p "feed/${version_dir}"
          done

          for f in site/*openwrt-23.05* site/*23.05*; do
            [ -f "$f" ] && cp "$f" feed/23.05/ 2>/dev/null || true
          done
          for f in site/*openwrt-24.10* site/*24.10*; do
            [ -f "$f" ] && cp "$f" feed/24.10/ 2>/dev/null || true
          done
          for f in site/*openwrt-25.12* site/*25.12*; do
            [ -f "$f" ] && cp "$f" feed/25.12/ 2>/dev/null || true
          done

          # Fallback: if version-specific naming didn't match, copy all
          for dir in feed/23.05 feed/24.10 feed/25.12; do
            if [ -z "$(ls -A "$dir" 2>/dev/null)" ]; then
              cp site/*.ipk "$dir/" 2>/dev/null || true
              cp site/*.apk "$dir/" 2>/dev/null || true
            fi
          done

          # Generate simple index pages
          for dir in feed/*/; do
            (cd "$dir" && ls -1 *.ipk *.apk 2>/dev/null > index.txt || true)
          done

          echo "<h1>opkg-autoupgrade feed</h1><ul>" > feed/index.html
          for dir in feed/*/; do
            version=$(basename "$dir")
            echo "<li><a href='${version}/'>${version}</a></li>" >> feed/index.html
          done
          echo "</ul>" >> feed/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: feed/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
